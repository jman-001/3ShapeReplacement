<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Public files, guides, downloads, and external resources."
    >
    <title>Resources | 3Shape Internal Tools</title>
    <link rel="icon" type="image/png" href="../assets/images/3shape_logo.png">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/catalog.css">
</head>

<body>
    <site-header active="resources"></site-header>

    <main class="catalog-page">
        <section class="page-intro">
            <p class="page-eyebrow">PUBLIC RESOURCE</p>
            <h1>Resources</h1>
            <p class="page-description">
                Public documentation, guides, files, and external resources
                for common support workflows.
            </p>
        </section>

        <div
            data-catalog
            data-source="../data/resources.json"
            data-access="public"
            aria-live="polite"
            aria-busy="true"
        >
            <p class="catalog-message">Loading catalog…</p>
        </div>
    </main>

    <footer id="site-footer">
        <p>3Shape Internal Tools</p>
    </footer>

    <script src="../js/header.js"></script>
    <script src="../js/support-mode.js"></script>
    <script src="../js/catalog.js"></script>
</body>

</html>
