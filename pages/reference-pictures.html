<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reference Pictures</title>
    <!-- =====================================================
         FAVICON
         ===================================================== -->

    <link rel="icon" type="image/png" href="../assets/images/3shape_logo.png">


    <!-- =====================================================
         STYLESHEETS
         ===================================================== -->

    <link rel="stylesheet" href="../css/global.css">

    <link rel="stylesheet" href="../css/navigation.css">

    <link rel="stylesheet" href="../css/layout.css">

    <link rel="stylesheet" href="../css/reference-pictures.css">

</head>

<body>

    <site-header active="references"></site-header>

    <main
        class="reference-page"
        data-source="../data/reference-pictures.json"
        aria-busy="true"
    >
        <header class="reference-header">
            <div>
                <p class="eyebrow">3SHAPE REPLACEMENT</p>
                <h1>Reference Pictures</h1>
                <p class="subtitle">Quick visual references for TRIOS scanners, accessories and connections.</p>
            </div><label class="search"><span>Search</span><input id="searchInput" type="search"
                    placeholder="Scanner, USB, cradle..." autocomplete="off"></label>
        </header>
        <nav class="filters" id="filters" aria-label="Scanner model filters"></nav>
        <section class="gallery" id="gallery" aria-live="polite"></section>
        <p class="empty" id="empty" hidden>No reference pictures match your search.</p>
    </main>
    <dialog class="lightbox" id="lightbox"><button class="close" id="closeLightbox" aria-label="Close">×</button><button
            class="arrow prev" id="prevPicture" aria-label="Previous picture">‹</button>
        <figure><img id="lightboxImage" alt="">
            <figcaption><span id="lightboxModel"></span>
                <h2 id="lightboxTitle"></h2>
                <p id="lightboxDescription"></p>
            </figcaption>
        </figure><button class="arrow next" id="nextPicture" aria-label="Next picture">›</button>
    </dialog>
    <script src="../js/header.js"></script>
    <script src="../js/support-mode.js"></script>
    <script src="../js/reference-pictures.js"></script>
</body>

</html>
